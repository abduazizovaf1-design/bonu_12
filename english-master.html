<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>English Master</title>
<style>
:root{
  --primary:#4f46e5; --primary-2:#7c3aed; --accent:#2563eb;
  --bg:#f5f6ff; --card:#ffffff; --text:#1e1b4b; --muted:#6b7280;
  --border:#e5e7f5; --ok:#16a34a; --bad:#dc2626; --warn:#d97706;
  --shadow:0 4px 18px rgba(79,70,229,.10);
  --grad:linear-gradient(135deg,#2563eb,#7c3aed);
  --nav-h:64px;
}
[data-theme="dark"]{
  --bg:#0f1020; --card:#1a1b33; --text:#eef0ff; --muted:#9aa0c3;
  --border:#2b2d4f; --shadow:0 4px 18px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;transition:background .3s,color .3s}
#app{max-width:880px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--bg);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem}
.logo{background:var(--grad);color:#fff;border-radius:10px;padding:5px 8px;font-size:.85rem}
.icon-btn{background:var(--card);border:1px solid var(--border);border-radius:12px;width:40px;height:40px;font-size:1.1rem;cursor:pointer;margin-left:6px}
main{flex:1;padding:8px 16px calc(var(--nav-h) + 28px);animation:fade .3s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1{font-size:1.5rem;margin:6px 0 4px} h2{font-size:1.15rem;margin:18px 0 8px} h3{font-size:1rem;margin:10px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:20px;margin:10px 0;box-shadow:var(--shadow)}
.hero .muted{color:rgba(255,255,255,.8)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.grid.two{grid-template-columns:1fr 1fr}
.stat{text-align:center}.stat b{display:block;font-size:1.5rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font-size:.95rem;font-weight:700;cursor:pointer;background:var(--grad);color:#fff;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--card);color:var(--primary);border:1.5px solid var(--primary)}
.btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)} .btn.warn{background:var(--warn)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.chip{display:inline-block;padding:4px 10px;border-radius:99px;background:rgba(124,58,237,.12);color:var(--primary-2);font-size:.78rem;font-weight:700}
.chip.active{background:var(--primary);color:#fff}
.bar{height:10px;border-radius:99px;background:var(--border);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--grad);border-radius:99px;transition:width .5s}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin:8px 0;cursor:pointer}
.list-item:hover{border-color:var(--primary)}
.example{border-left:4px solid var(--primary);padding:8px 12px;margin:8px 0;background:rgba(79,70,229,.06);border-radius:0 12px 12px 0}
.example .en{font-weight:700}.example .uz{color:var(--muted)}
.formula{background:var(--grad);color:#fff;padding:12px 14px;border-radius:12px;font-family:ui-monospace,monospace;margin:8px 0}
.mistake{border-left:4px solid var(--bad);padding:8px 12px;margin:8px 0;background:rgba(220,38,38,.07);border-radius:0 12px 12px 0}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:.95rem;cursor:pointer}
.opt.sel{border-color:var(--primary);background:rgba(79,70,229,.08)}
.opt.right{border-color:var(--ok);background:rgba(22,163,74,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(220,38,38,.1)}
.explain{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(37,99,235,.08);font-size:.9rem}
input[type=text],input[type=search],select,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--card);color:var(--text);font-size:1rem;font-family:inherit}
textarea{min-height:90px;resize:vertical}
label{font-weight:600;font-size:.9rem;display:block;margin:10px 0 4px}
.flash{perspective:900px;margin:12px 0}
.flash-inner{min-height:200px;border-radius:22px;background:var(--grad);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;cursor:pointer;box-shadow:var(--shadow)}
.flash-inner .big{font-size:2rem;font-weight:800}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);padding-bottom:env(safe-area-inset-bottom);background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-around;z-index:30;max-width:880px;margin:0 auto}
.bottom-nav button{flex:1;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;font-size:1.2rem}
.bottom-nav small{font-size:.68rem;font-weight:700}
.bottom-nav button.active{color:var(--primary)}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:60;font-size:.9rem;max-width:90%}
.toast.show{opacity:1;transform:translate(-50%,0)}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap}
.msg.ai{background:var(--card);border:1px solid var(--border);align-self:flex-start}
.msg.user{background:var(--grad);color:#fff;align-self:flex-end}
.fb{border:1px dashed var(--primary);border-radius:14px;padding:10px 12px;margin-top:6px;font-size:.88rem;background:rgba(79,70,229,.05);color:var(--text)}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:1.6rem;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(124,58,237,.15)}}
.notice{padding:10px 12px;border-radius:12px;background:rgba(217,119,6,.12);border:1px solid var(--warn);font-size:.88rem;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left}
.overflow{overflow-x:auto}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
#confetti i{position:absolute;top:-10px;width:9px;height:14px;animation:fall 2.2s linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.8}}
.week{display:flex;gap:6px;align-items:flex-end;height:110px}
.week div{flex:1;text-align:center;font-size:.7rem}
.week i{display:block;background:var(--grad);border-radius:6px 6px 0 0;min-height:3px}
@media(min-width:700px){main{padding-left:28px;padding-right:28px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="logo">EM</span><span>English Master</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="btnSearch" aria-label="Search">🔍</button>
      <button class="icon-btn" id="btnTheme" aria-label="Theme">🌙</button>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="bottom-nav" id="nav">
    <button data-route="home" class="active"><span>🏠</span><small>Home</small></button>
    <button data-route="lessons"><span>📚</span><small>Lessons</small></button>
    <button data-route="practice"><span>🎯</span><small>Practice</small></button>
    <button data-route="progress"><span>📈</span><small>Progress</small></button>
    <button data-route="profile"><span>👤</span><small>Profile</small></button>
  </nav>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="confetti"></div>

<script>
// Grammar lessons. Q(question, options, correctIndex, explanation)
const Q = (q, o, a, e) => ({ q, o, a, e });
const EX = (q, a, e) => ({ q, a, e });

window.GRAMMAR = [
{
  id: "subject-pronouns", title: "Subject pronouns", uz: "Kishilik olmoshlari", level: "A1", cat: "Boshlang'ich",
  def: "Subject pronoun — gapda ish-harakatni bajaruvchi (ega) o'rnida keladigan olmosh: I, you, he, she, it, we, they.",
  explain: "Ingliz tilida gap deyarli har doim ega bilan boshlanadi. O'zbek tilida 'boraman' desak, 'men' so'zi yashirin bo'ladi, inglizcha esa 'I go' deb albatta aytish kerak. He — erkak kishi, she — ayol kishi, it — jonsiz narsa yoki hayvon uchun. You ham 'sen', ham 'siz', ham 'sizlar' ma'nosida ishlatiladi.",
  formula: "I / you / he / she / it / we / they + fe'l",
  uses: ["Gap egasini ko'rsatish.", "Ismni takrorlamaslik uchun: Ali → he, Mary → she.", "Hayvon va narsalar uchun it."],
  forms: { aff: "She works here.", neg: "She does not work here.", q: "Does she work here?", short: "Yes, she does. / No, she doesn't." },
  examples: [["I am a student.", "Men o'quvchiman."],["You are my friend.", "Sen mening do'stimsan."],["He plays football.", "U (erkak) futbol o'ynaydi."],["She reads a book.", "U (ayol) kitob o'qiydi."],["It is a cat.", "Bu mushuk."],["We live in Tashkent.", "Biz Toshkentda yashaymiz."],["They are teachers.", "Ular o'qituvchilar."]],
  mistakes: [["Is a teacher.", "He is a teacher.", "Ega tushib qolmasligi kerak."],["Him is tall.", "He is tall.", "Egalik o'rnida him emas, he ishlatiladi."]],
  exercises: [EX("Ali is my brother. ___ is 15. (he/she)", "he", "Ali — erkak, shuning uchun he."),EX("Anna and I are friends. ___ study together. (we/they)", "we", "Anna va men = biz."),EX("The book is on the table. ___ is new. (it/he)", "it", "Narsa uchun it."),EX("My parents are at home. ___ are watching TV. (we/they)", "they", "Ular = they."),EX("Dilnoza is a doctor. ___ works in a hospital. (he/she)", "she", "Ayol uchun she.")],
  quiz: [
    Q("Mary is my sister. ___ is a nurse.", ["He","She","It","They"], 1, "Mary — ayol, she."),
    Q("Tom and Jack are brothers. ___ are tall.", ["We","He","They","It"], 2, "Ikki kishi — they."),
    Q("The dog is hungry. ___ wants food.", ["He","It","She","We"], 1, "Hayvon uchun odatda it."),
    Q("You and I are classmates. ___ study English.", ["They","You","We","She"], 2, "Siz va men = biz (we)."),
    Q("___ am happy today.", ["I","He","She","It"], 0, "am faqat I bilan."),
    Q("Which pronoun is for a man?", ["she","he","it","we"], 1, "he — erkak kishi."),
    Q("My car is red. ___ is very fast.", ["It","She","He","They"], 0, "Narsa — it."),
    Q("Aziza and Malika are friends. ___ live near me.", ["She","We","They","It"], 2, "Ikki ayol — they."),
    Q("___ is a teacher. (Mr. Brown)", ["She","He","It","They"], 1, "Mr. — erkak, he."),
    Q("Uzbek 'Siz' (bir kishiga, hurmat) = ?", ["you","he","they","it"], 0, "You — sen/siz/sizlar.")
  ]
},
{
  id: "verb-to-be", title: "Verb to be (am / is / are)", uz: "To be fe'li", level: "A1", cat: "Boshlang'ich",
  def: "To be — 'bo'lmoq' fe'li. Biror kishi yoki narsa kim/nima ekanini, qanday ekanini, qayerda ekanini bildiradi.",
  explain: "O'zbek tilida 'Men o'quvchiman' desak, alohida fe'l kerak emas (-man qo'shimchasi bor). Inglizchada esa albatta am/is/are kerak. I bilan am, he/she/it bilan is, we/you/they bilan are ishlatiladi. Inkor uchun not qo'shiladi, so'roq uchun fe'l gap boshiga chiqadi.",
  formula: "I am | he/she/it is | we/you/they are",
  uses: ["Kim ekanini aytish: I am a doctor.", "Yosh va holatni aytish: She is 20. He is tired.", "Joyni aytish: They are at home."],
  forms: { aff: "I am a student.", neg: "I am not a student. / He is not (isn't) here.", q: "Are they friends?", short: "Yes, they are. / No, they aren't." },
  examples: [["I am a student.", "Men o'quvchiman."],["She is not at home.", "U uyda emas."],["Are they friends?", "Ular do'stmi?"],["We are from Uzbekistan.", "Biz O'zbekistondanmiz."],["He is twenty years old.", "U yigirma yoshda."],["It is cold today.", "Bugun sovuq."],["Is your mother at work?", "Onangiz ishdami?"]],
  mistakes: [["I are a student.", "I am a student.", "I faqat am bilan keladi."],["She not is happy.", "She is not happy.", "not fe'ldan keyin turadi."],["He have 20 years.", "He is 20 years old.", "Yoshni aytishda have emas, to be ishlatiladi."]],
  exercises: [EX("I ___ from Samarkand. (am/is/are)", "am", "I bilan am."),EX("She ___ my teacher. (am/is/are)", "is", "she bilan is."),EX("They ___ at school. (am/is/are)", "are", "they bilan are."),EX("___ you ready? (Am/Is/Are)", "Are", "you bilan are."),EX("It ___ not a problem. (am/is/are)", "is", "it bilan is.")],
  quiz: [
    Q("He ___ a doctor.", ["am","is","are","be"], 1, "he + is."),
    Q("We ___ in the classroom.", ["is","am","are","be"], 2, "we + are."),
    Q("I ___ 18 years old.", ["is","are","am","be"], 2, "I + am."),
    Q("___ she your sister?", ["Are","Is","Am","Do"], 1, "she + is, so'roqda Is she...?"),
    Q("They ___ not happy.", ["is","am","are","do"], 2, "they + are."),
    Q("Choose the correct negative: 'He is a teacher.'", ["He not is a teacher.","He is not a teacher.","He does not a teacher.","He no is a teacher."], 1, "is + not."),
    Q("Short answer: 'Are you a student?'", ["Yes, I am.","Yes, I is.","Yes, I do.","Yes, I are."], 0, "Are you...? — Yes, I am."),
    Q("The books ___ on the table.", ["is","are","am","be"], 1, "Ko'plik — are."),
    Q("My name ___ Ali.", ["am","are","is","be"], 2, "name birlik — is."),
    Q("___ I late?", ["Is","Are","Am","Do"], 2, "I bilan Am I...?")
  ]
},
{
  id: "articles", title: "Articles: a, an, the", uz: "Artikllar", level: "A1", cat: "Boshlang'ich",
  def: "Artikl — otdan oldin keladigan kichik so'z. Ingliz tilida uchta artikl bor: a, an, the.",
  explain: "A va an — noaniq artikllar: biror narsani birinchi marta aytganda yoki 'bitta' ma'nosida. A undosh tovush bilan boshlangan so'z oldidan (a book), an unli tovush bilan boshlangan so'z oldidan (an apple) ishlatiladi. The — aniq artikl: ikkala suhbatdosh qaysi narsa haqida gapirayotganini biladi (The book is on the table). Ko'plik va sanalmaydigan otlar oldida a/an ishlatilmaydi.",
  formula: "a + undosh tovush | an + unli tovush | the + aniq narsa",
  uses: ["a/an — birinchi marta aytilgan narsa.", "the — oldin aytilgan yoki yagona narsa (the sun, the moon).", "Artiklsiz — umumiy ko'plik va sanalmaydigan otlar: I like music."],
  forms: { aff: "I have a dog.", neg: "I don't have a dog.", q: "Do you have a dog?", short: "Yes, I do. / No, I don't." },
  examples: [["I have a book.", "Mening bitta kitobim bor."],["She eats an apple.", "U olma yeydi."],["The apple is red.", "Olma qizil (o'sha olma)."],["He is an engineer.", "U muhandis."],["The sun is hot.", "Quyosh issiq."],["It is an hour.", "Bu bir soat. (h aytilmaydi, shuning uchun an)"],["She is a university student.", "U universitet talabasi. (yu- undosh tovush, shuning uchun a)"]],
  mistakes: [["She is a engineer.", "She is an engineer.", "engineer unli tovush bilan boshlanadi."],["I like the music.", "I like music.", "Umumiy ma'noda artikl kerak emas."],["I have a books.", "I have books.", "Ko'plik oldida a ishlatilmaydi."]],
  exercises: [EX("I have ___ orange. (a/an)", "an", "orange unli bilan boshlanadi."),EX("She is ___ teacher. (a/an)", "a", "teacher undosh bilan boshlanadi."),EX("___ moon is bright tonight. (A/The)", "The", "Oy yagona."),EX("He is ___ honest man. (a/an)", "an", "honest: h aytilmaydi."),EX("I saw a cat. ___ cat was black. (A/The)", "The", "Oldin aytilgan mushuk.")],
  quiz: [
    Q("I need ___ umbrella.", ["a","an","the","—"], 1, "umbrella unli bilan boshlanadi."),
    Q("She is ___ doctor.", ["a","an","the","—"], 0, "doctor undosh bilan boshlanadi."),
    Q("Open ___ window, please. (aniq deraza)", ["a","an","the","—"], 2, "Aniq narsa — the."),
    Q("He is ___ European.", ["an","a","the","—"], 1, "European 'yu' bilan boshlanadi — a."),
    Q("I like ___ music.", ["a","an","the","—"], 3, "Umumiy ma'noda artikl kerak emas."),
    Q("We saw ___ elephant at the zoo.", ["a","an","the","—"], 1, "elephant unli."),
    Q("___ Earth goes around ___ Sun.", ["The/the","A/a","An/an","—/—"], 0, "Yagona narsalar — the."),
    Q("It takes ___ hour.", ["a","an","the","—"], 1, "hour: h aytilmaydi — an."),
    Q("She has ___ car. ___ car is new.", ["a / The","the / A","an / The","a / A"], 0, "Birinchi marta a, ikkinchi marta the."),
    Q("Which is correct?", ["an university","a university","the university's a","an uniform"], 1, "university — 'yu' tovushi, a.")
  ]
},
{
  id: "plural-nouns", title: "Singular and plural nouns", uz: "Birlik va ko'plik", level: "A1", cat: "Boshlang'ich",
  def: "Ko'plik shakli — bir nechta narsani bildiradi. Ko'pchilik otlarga -s qo'shiladi.",
  explain: "Ko'plik yasash qoidalari: 1) Ko'pchilik otlarga -s: book → books. 2) -s, -x, -ch, -sh, -o bilan tugasa -es: bus → buses, box → boxes. 3) Undosh + y bilan tugasa -ies: city → cities. 4) -f/-fe bilan tugasa -ves: knife → knives. 5) Tartibsiz: man → men, child → children, foot → feet, person → people.",
  formula: "noun + s / es / ies | tartibsiz shakllar",
  uses: ["Ikki va undan ortiq narsani aytishda.", "Ko'plik bilan are, birlik bilan is ishlatiladi."],
  forms: { aff: "There are two boxes.", neg: "There aren't any boxes.", q: "Are there any boxes?", short: "Yes, there are." },
  examples: [["one book — two books", "bitta kitob — ikkita kitob"],["a box — boxes", "quti — qutilar"],["a city — cities", "shahar — shaharlar"],["a child — children", "bola — bolalar"],["a man — men", "erkak — erkaklar"],["a foot — feet", "oyoq — oyoqlar"],["a knife — knives", "pichoq — pichoqlar"]],
  mistakes: [["two childs", "two children", "child tartibsiz ko'plik."],["three man", "three men", "Ko'plikda men."],["a cities", "a city / cities", "a bilan faqat birlik."]],
  exercises: [EX("one watch — two ___", "watches", "-ch bilan tugasa -es."),EX("one baby — two ___", "babies", "undosh + y → ies."),EX("one tooth — two ___", "teeth", "Tartibsiz."),EX("one woman — two ___", "women", "Tartibsiz."),EX("one leaf — two ___", "leaves", "f → ves.")],
  quiz: [
    Q("Plural of 'bus':", ["buss","buses","bus","busies"], 1, "-s bilan tugasa -es."),
    Q("Plural of 'city':", ["citys","cities","cityes","city"], 1, "undosh + y → ies."),
    Q("Plural of 'child':", ["childs","childes","children","childrens"], 2, "Tartibsiz."),
    Q("Plural of 'man':", ["mans","mens","men","manes"], 2, "Tartibsiz."),
    Q("Plural of 'box':", ["boxs","boxes","boxies","box"], 1, "-x → -es."),
    Q("Plural of 'day':", ["days","daies","dayes","dayies"], 0, "unli + y → faqat -s."),
    Q("Plural of 'person' (oddiy):", ["persons","people","persones","peoples"], 1, "people ko'p ishlatiladi."),
    Q("Plural of 'knife':", ["knifes","knives","knifs","knifees"], 1, "-fe → -ves."),
    Q("Plural of 'foot':", ["foots","feet","feets","footes"], 1, "Tartibsiz."),
    Q("Plural of 'tomato':", ["tomatos","tomatoes","tomatoies","tomato"], 1, "-o → -es (ko'p hollarda).")
  ]
},
{
  id: "present-simple", title: "Present Simple", uz: "Oddiy hozirgi zamon", level: "A1", cat: "Zamonlar",
  def: "Present Simple — odatiy, doimiy va takrorlanuvchi ish-harakatlar hamda umumiy haqiqatlar uchun zamon.",
  explain: "Har kuni, har hafta takrorlanadigan ishlarni aytganda ishlatamiz. He/she/it bilan fe'lga -s yoki -es qo'shiladi. Inkor va so'roq gaplarda do/does yordamchi fe'li ishlatiladi, bunda asosiy fe'l -s olmaydi. -s, -sh, -ch, -x, -o bilan tugagan fe'llarga -es qo'shiladi (watch → watches), undosh + y → ies (study → studies).",
  formula: "Subject + V1 (he/she/it + V1-s/es)\nNeg: Subject + do/does + not + V1\nQ: Do/Does + subject + V1?",

<script>
(function () {
'use strict';
/* ============ helpers ============ */
const $ = (s, e = document) => e.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const dayAgo = n => { const d = new Date(); d.setDate(d.getDate() - n); return dstr(d); };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const dayNum = () => Math.floor(Date.now() / 864e5);

/* ============ state ============ */
const DEF = { name: '', avatar: '🎓', level: 'A1', goal: 50, reason: '', topics: [], theme: 'light', lang: 'uz', notif: false, accent: 'en-US', aiUrl: '/api/chat', showTr: true,
  streak: 0, lastDay: '', xp: 0, skills: { grammar: 0, vocab: 0, reading: 0, listening: 0, speaking: 0, writing: 0 },
  daily: {}, done: {}, scores: {}, favLessons: [], favWords: [], quizzes: [], srs: {}, mistakes: [], speakSessions: [], badges: [], ch: {}, ch30: [], writings: [] };
let S;
function load() { let o = {}; try { o = JSON.parse(localStorage.getItem('em_state') || '{}') || {}; } catch (e) { o = {}; } S = Object.assign({}, JSON.parse(JSON.stringify(DEF)), o); S.skills = Object.assign({}, DEF.skills, o.skills || {}); }
function save() { try { localStorage.setItem('em_state', JSON.stringify(S)); } catch (e) { toast('Saqlashning iloji bo\'lmadi (brauzer xotirasi to\'la yoki o\'chirilgan).'); } }
load();
const L = (uz, en) => S.lang === 'en' ? en : uz;
const rec = (d = today()) => (S.daily[d] = S.daily[d] || { xp: 0, min: 0 });

function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function confetti() { const c = $('#confetti'); const cols = ['#2563eb', '#7c3aed', '#f59e0b', '#16a34a', '#ec4899']; for (let i = 0; i < 46; i++) { const e = document.createElement('i'); e.style.left = Math.random() * 100 + '%'; e.style.background = cols[i % 5]; e.style.animationDelay = Math.random() * .6 + 's'; c.appendChild(e); } setTimeout(() => c.innerHTML = '', 3200); }
function touch() { const t = today(); if (S.lastDay === t) return; S.streak = S.lastDay === dayAgo(1) ? S.streak + 1 : 1; S.lastDay = t; }
function addXP(n, skill) {
  touch(); const r = rec(); const before = r.xp; r.xp += n; S.xp += n; if (skill) S.skills[skill] = (S.skills[skill] || 0) + n;
  if (before < S.goal && r.xp >= S.goal) { confetti(); toast(L('🎉 Kunlik maqsad bajarildi!', '🎉 Daily goal reached!')); if (S.notif && 'Notification' in window && Notification.permission === 'granted') { try { new Notification('English Master', { body: 'Daily goal reached! 🎉' }); } catch (e) {} } }
  checkBadges(); save();
}
const BADGES = [
  ['first', '🥇 First lesson', () => Object.keys(S.done).length >= 1], ['xp100', '⭐ 100 XP', () => S.xp >= 100], ['xp500', '🌟 500 XP', () => S.xp >= 500],
  ['streak3', '🔥 3-day streak', () => S.streak >= 3], ['streak7', '🔥 7-day streak', () => S.streak >= 7], ['quiz10', '🧠 10 quizzes', () => S.quizzes.length >= 10],
  ['words50', '📖 50 words', () => masteredCount() + Object.keys(S.srs).length >= 50], ['perfect', '💯 Perfect quiz', () => S.quizzes.some(q => q.pct === 100)]];
function checkBadges() { BADGES.forEach(b => { if (!S.badges.includes(b[0]) && b[2]()) { S.badges.push(b[0]); toast('🏅 ' + b[1]); } }); }
const masteredCount = () => Object.values(S.srs).filter(r => r.iv >= 7).length;

/* ============ speech ============ */
const hasTTS = 'speechSynthesis' in window;
function say(text, rate) { if (!hasTTS) { toast(L('Bu brauzer ovoz chiqarishni qo\'llamaydi.', 'Text-to-speech is not supported in this browser.')); return; } speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = S.accent; u.rate = rate || .9; speechSynthesis.speak(u); }
function sayQueue(lines) { if (!hasTTS) return say(''); speechSynthesis.cancel(); lines.forEach(t => { const u = new SpeechSynthesisUtterance(t); u.lang = S.accent; u.rate = .9; speechSynthesis.speak(u); }); }
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recog = null;
function listen(onText, onEnd) {
  if (!SR) { toast(L('Bu brauzerda ovozni matnga aylantirish yo\'q (Chrome/Edge/Safari tavsiya etiladi). Matn yozing.', 'Speech recognition is not available here. Please type instead.')); return false; }
  if (recog) { try { recog.stop(); } catch (e) {} recog = null; if (onEnd) onEnd(); return false; }
  recog = new SR(); recog.lang = S.accent; recog.interimResults = true; recog.continuous = false;
  recog.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; onText(t); };
  recog.onerror = e => { toast(L('Mikrofon xatosi: ', 'Mic error: ') + (e.error || '')); };
  recog.onend = () => { recog = null; if (onEnd) onEnd(); };
  try { recog.start(); toast(L('Tinglayapman… gapiring', 'Listening… speak now')); return true; } catch (e) { recog = null; return false; }
}

/* ============ data helpers ============ */
const ALLW = []; VOCAB.forEach(t => t.words.forEach(w => ALLW.push(Object.assign({ topic: t.id, level: t.level }, w))));
const LEVELS = ['A1', 'A2', 'B1', 'B2', 'C1', 'C2', 'IELTS'];
function vocabQs(words, n) { const pool = ALLW; return pick(words, n).map(w => { const wrong = pick(pool.filter(x => x.uz !== w.uz), 3).map(x => x.uz); const opts = shuffle([w.uz].concat(wrong)); return { q: '"' + w.w + '" — ' + L('o\'zbekcha ma\'nosi?', 'meaning in Uzbek?'), o: opts, a: opts.indexOf(w.uz), e: w.en + ' — ' + w.eu }; }); }
const allGrammarQs = () => GRAMMAR.flatMap(g => g.quiz);
const norm = s => String(s).toLowerCase().replace(/[’`]/g, "'").replace(/[.,!?]/g, '').replace(/\bdo not\b/g, "don't").replace(/\bdoes not\b/g, "doesn't").replace(/\bdid not\b/g, "didn't").replace(/\bis not\b/g, "isn't").replace(/\bare not\b/g, "aren't").replace(/\bwill not\b/g, "won't").replace(/\bhas not\b/g, "hasn't").replace(/\bhave not\b/g, "haven't").replace(/\bcannot\b/g, "can't").replace(/\s+/g, ' ').trim();

/* ============ view plumbing ============ */
let timers = [];
function clearTimers() { timers.forEach(clearInterval); timers = []; if (recog) { try { recog.stop(); } catch (e) {} recog = null; } }
const view = html => { $('#view').innerHTML = html; window.scrollTo(0, 0); };
const goBtn = (hash, label, cls = 'btn') => `<button class="${cls}" data-go="${hash}">${label}</button>`;
const sayBtn = (t, label = '🔊') => `<button class="btn sm sec" data-act="say" data-t="${esc(t)}" aria-label="Play Audio">${label}</button>`;
const bar = p => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, p))}%"></i></div>`;
const back = (h, l) => `<button class="btn sm sec" data-go="${h}">← ${l || L('Orqaga', 'Back')}</button>`;

function nextLesson() { return GRAMMAR.find(g => !S.done[g.id]) || GRAMMAR[0]; }
function weekData() { const a = []; for (let i = 6; i >= 0; i--) { const d = dayAgo(i); const r = S.daily[d] || { xp: 0, min: 0 }; a.push({ d, xp: r.xp, min: r.min }); } return a; }

/* ============ HOME ============ */
function home() {
  if (!S.name) {
    return view(`<div class="hero"><h1>👋 ${L('Xush kelibsiz!', 'Welcome!')}</h1><p class="muted">${L('Ismingizni kiriting va o\'rganishni boshlang.', 'Enter your name and start learning.')}</p></div>
    <div class="card"><label>${L('Ismingiz', 'Your name')}</label><input type="text" id="nameIn" maxlength="30" placeholder="Ali">
    <label>${L('Darajangiz', 'Your level')}</label><select id="lvlIn">${LEVELS.map(l => `<option ${l === S.level ? 'selected' : ''}>${l}</option>`).join('')}</select>
    <p><button class="btn" data-act="saveName">▶ Start Learning</button></p></div>`);
  }
  const r = rec(), pct = Math.min(100, Math.round(r.xp / S.goal * 100)), nl = nextLesson();
  const doneN = Object.keys(S.done).filter(k => GRAMMAR.some(g => g.id === k)).length;
  const learned = Math.round(doneN / GRAMMAR.length * 100);
  const dn = dayNum(), todayWords = Array.from({ length: 3 }, (_, i) => ALLW[(dn * 10 + i) % ALLW.length]);
  const tg = GRAMMAR[dn % GRAMMAR.length], wk = weekData(), mx = Math.max(1, ...wk.map(x => x.min));
  const rec3 = GRAMMAR.filter(g => !S.done[g.id] && g.id !== nl.id).slice(0, 3);
  view(`<div class="hero"><p class="muted">${L('Xush kelibsiz!', 'Welcome back!')}</p><h1>${esc(S.avatar)} ${esc(S.name)}</h1>
    <div class="row between"><span>🎯 ${L('Kunlik maqsad', 'Daily goal')}: ${r.xp}/${S.goal} XP</span><span>🔥 ${S.streak} ${L('kun', 'days')}</span></div>${bar(pct)}
    <p style="margin-top:12px"><button class="btn" style="background:#fff;color:#4f46e5" data-go="#/lesson/${nl.id}">▶ ${Object.keys(S.done).length ? 'Continue Learning' : 'Start Learning'}: ${esc(nl.title)}</button></p></div>
  <div class="grid two"><div class="card stat"><b>${learned}%</b><span class="muted">${L('O\'rganilgan mavzular', 'Topics learned')}</span></div><div class="card stat"><b>${S.xp}</b><span class="muted">XP</span></div></div>
  <h2>📖 ${L('Bugungi yangi so\'zlar', 'Today\'s new words')}</h2>
  <div class="card">${todayWords.map(w => `<div class="row between" style="margin:6px 0"><span><b>${esc(w.w)}</b> — ${esc(w.uz)}</span>${sayBtn(w.w)}</div>`).join('')}<p><button class="btn sm" data-go="#/flash">Flashcards</button></p></div>
  <h2>📘 ${L('Bugungi grammatika', 'Today\'s grammar')}</h2>
  <div class="list-item" data-go="#/lesson/${tg.id}"><div><b>${esc(tg.title)}</b><div class="muted">${esc(tg.uz)}</div></div><span class="chip">${tg.level}</span></div>
  <h2>✅ ${L('Kunlik test va challenge', 'Daily quiz & challenge')}</h2>
  <div class="row"><button class="btn" data-act="dailyQuiz">Start Quiz</button><button class="btn sec" data-go="#/daily">Daily Challenge</button></div>
  <h2>📊 ${L('Haftalik statistika (daqiqa)', 'Weekly stats (minutes)')}</h2>
  <div class="card"><div class="week">${wk.map(x => `<div><i style="height:${Math.round(x.min / mx * 90)}px"></i>${x.d.slice(8)}</div>`).join('')}</div><p class="muted">${L('Ilovada o\'tkazilgan vaqt asosida (haqiqiy ma\'lumot).', 'Based on real time spent in the app.')}</p></div>
  ${rec3.length ? `<h2>⭐ ${L('Tavsiya etilgan darslar', 'Recommended')}</h2>` + rec3.map(g => `<div class="list-item" data-go="#/lesson/${g.id}"><div><b>${esc(g.title)}</b><div class="muted">${esc(g.uz)}</div></div><span class="chip">${g.level}</span></div>`).join('') : ''}`);
}

/* ============ LESSONS ============ */
const SECTIONS = [['grammar', 'Grammar'], ['vocab', 'Vocabulary'], ['irregular', 'Irregular verbs'], ['reading', 'Reading'], ['listening', 'Listening'], ['speaking', 'Speaking'], ['writing', 'Writing'], ['pron', 'Pronunciation'], ['ielts', 'IELTS'], ['roadmap', 'Roadmap']];
const PLANNED = ['Possessive adjectives/pronouns', 'Articles advanced', 'Countable & uncountable', 'Prepositions of place/time', 'Past Continuous', 'Past Perfect', 'Future Continuous / Perfect', 'Conditionals 0–3, mixed', 'Passive voice (all tenses)', 'Reported speech', 'Relative clauses', 'Gerund vs infinitive', 'Phrasal verbs & idioms dictionary', 'Question tags', 'Inversion & cleft sentences', 'Punctuation and spelling', 'C1/C2 vocabulary', 'More reading/listening texts', 'Full IELTS mock tests'];
function lessons(sec, lvl) {
  sec = sec || 'grammar'; lvl = lvl || 'all';
  const tabs = `<div class="tabs">${SECTIONS.map(s => `<button class="chip ${s[0] === sec ? 'active' : ''}" data-go="#/lessons/${s[0]}">${s[1]}</button>`).join('')}</div>`;
  const lvlBar = `<div class="tabs" style="margin:8px 0"><button class="chip ${lvl === 'all' ? 'active' : ''}" data-go="#/lessons/${sec}/all">All</button>${LEVELS.map(l => `<button class="chip ${lvl === l ? 'active' : ''}" data-go="#/lessons/${sec}/${l}">${l}</button>`).join('')}</div>`;
  const f = x => lvl === 'all' || x.level === lvl;
  let body = '';
  if (sec === 'grammar') {
    const cats = [...new Set(GRAMMAR.map(g => g.cat))];
    body = lvlBar + cats.map(c => `<h2>${esc(c)}</h2>` + GRAMMAR.filter(g => g.cat === c && f(g)).map(g => `<div class="list-item" data-go="#/lesson/${g.id}"><div><b>${S.done[g.id] ? '✅ ' : ''}${esc(g.title)}</b><div class="muted">${esc(g.uz)}</div></div><span class="chip">${g.level}</span></div>`).join('')).join('');
  } else if (sec === 'vocab') {
    body = lvlBar + VOCAB.filter(f).map(t => `<div class="list-item" data-go="#/vocab/${t.id}"><div><b>${esc(t.title)}</b><div class="muted">${esc(t.uz)} · ${t.words.length} ${L('so\'z', 'words')}</div></div><span class="chip">${t.level}</span></div>`).join('') + `<div class="card"><button class="btn" data-go="#/flash">Flashcards (SRS)</button> <button class="btn sec" data-go="#/search">🔍 Dictionary</button></div>`;
  } else if (sec === 'irregular') {
    body = `<div class="card"><input type="search" id="irrQ" placeholder="🔍 go, went, bormoq..."><p class="muted">${IRREGULAR.length} ${L('ta fe\'l', 'verbs')}</p><div class="overflow"><table><thead><tr><th>V1</th><th>V2</th><th>V3</th><th>UZ</th><th></th></tr></thead><tbody id="irrBody">${irrRows('')}</tbody></table></div></div><button class="btn" data-act="irrQuiz">Start Quiz</button>`;
  } else if (sec === 'reading') {
    body = lvlBar + READING.filter(f).map(r => `<div class="list-item" data-go="#/read/${r.id}"><div><b>${S.done[r.id] ? '✅ ' : ''}${esc(r.title)}</b></div><span class="chip">${r.level}</span></div>`).join('');
  } else if (sec === 'listening') {
    body = lvlBar + LISTENING.filter(f).map(r => `<div class="list-item" data-go="#/listen/${r.id}"><div><b>${S.done[r.id] ? '✅ ' : ''}${esc(r.title)}</b></div><span class="chip">${r.level}</span></div>`).join('');
  } else if (sec === 'speaking') {

const LINKERS = ['however', 'moreover', 'furthermore', 'therefore', 'because', 'although', 'firstly', 'secondly', 'in conclusion', 'for example', 'in addition', 'on the other hand', 'and', 'but', 'so', 'then', 'also'];
function writeCheck(text, w) {
  const words = text.trim().match(/\S+/g) || [], n = words.length, sents = text.split(/[.!?]+/).map(s => s.trim()).filter(Boolean);
  const caps = sents.filter(s => /^[A-Z]/.test(s)).length, low = text.toLowerCase(), links = LINKERS.filter(l => low.includes(l));
  const uniq = new Set(words.map(x => x.toLowerCase().replace(/[^a-z']/g, ''))).size, avg = sents.length ? Math.round(n / sents.length) : 0;
  const m = [];
  m.push((n >= w.min ? '✅' : '⚠️') + ` ${L('Uzunlik', 'Length')}: ${n}/${w.min}`);
  m.push((sents.length && caps === sents.length ? '✅' : '⚠️') + ` ${L('Bosh harf bilan boshlangan gaplar', 'Sentences starting with capital')}: ${caps}/${sents.length}`);
  m.push((/[.!?]\s*$/.test(text.trim()) ? '✅' : '⚠️') + ` ${L('Gap oxirida tinish belgisi', 'Ends with punctuation')}`);
  m.push((links.length >= 2 ? '✅' : '⚠️') + ` ${L('Bog\'lovchi so\'zlar', 'Linking words')}: ${links.join(', ') || '—'}`);
  m.push((n && uniq / n > .5 ? '✅' : '⚠️') + ` ${L('Lug\'at xilma-xilligi', 'Vocabulary variety')}: ${n ? Math.round(uniq / n * 100) : 0}%`);
  m.push(`ℹ️ ${L('O\'rtacha gap uzunligi', 'Average sentence length')}: ${avg} ${L('so\'z', 'words')}`);
  return m;
}

/* ---- quiz engine ---- */
let QZ = null;
function startQuiz(qs, opt) {
  if (!qs.length) { toast(L('Savollar topilmadi.', 'No questions.')); return; }
  qs = shuffle(qs).slice(0, opt.count || 20).map(q => { const idx = q.o.map((_, i) => i); const keep = /^(True|False|Not Given|Yes|No)$/i.test(q.o[0]); const ord = keep ? idx : shuffle(idx); return { q: q.q, o: ord.map(i => q.o[i]), a: ord.indexOf(q.a), e: q.e, sel: null, checked: false, show: false }; });
  QZ = { qs, i: 0, opt, t0: Date.now(), left: opt.timed || 0 }; clearTimers();
  if (location.hash === '#/quiz') quizView(); else location.hash = '#/quiz';
}
function quizView() {
  if (!QZ) return practice();
  if (QZ.opt.timed && !timers.length) timers.push(setInterval(() => { QZ.left--; const el = $('#qzT'); if (el) el.textContent = pad(Math.floor(QZ.left / 60)) + ':' + pad(QZ.left % 60); if (QZ.left <= 0) { clearTimers(); finishQuiz(); } }, 1000));
  const q = QZ.qs[QZ.i], n = QZ.qs.length;
  view(`<div class="row between"><b>${esc(QZ.opt.title)}</b>${QZ.opt.timed ? `<span class="chip" id="qzT">${pad(Math.floor(QZ.left / 60))}:${pad(QZ.left % 60)}</span>` : ''}<span class="muted">${QZ.i + 1}/${n}</span></div>${bar((QZ.i + 1) / n * 100)}
  <div class="card"><h3>${esc(q.q)}</h3>${q.o.map((o, i) => { let c = 'opt'; if (q.checked) { if (i === q.a) c += ' right'; else if (i === q.sel) c += ' wrong'; } else if (i === q.sel) c += ' sel'; return `<button class="${c}" data-act="pick" data-i="${i}">${esc(o)}</button>`; }).join('')}
  <div class="row"><button class="btn" data-act="qcheck" ${q.sel == null || q.checked ? 'disabled' : ''}>Check Answer</button><button class="btn sec" data-act="qexp" ${q.checked ? '' : 'disabled'}>Show Explanation</button></div>
  ${q.show ? `<div class="explain">${q.sel === q.a ? '✅ ' : '❌ '}<b>${esc(q.o[q.a])}</b><br>${esc(q.e || '')}</div>` : ''}</div>
  <div class="row between"><button class="btn sec" data-act="qprev" ${QZ.i === 0 ? 'disabled' : ''}>← Previous Question</button>${QZ.i < n - 1 ? `<button class="btn" data-act="qnext">Next Question →</button>` : `<button class="btn ok" data-act="qfinish">Finish</button>`}</div>`);
}
function finishQuiz() {
  clearTimers(); const Z = QZ; if (!Z) return; const n = Z.qs.length; Z.qs.forEach(q => { if (q.sel != null && !q.checked) q.checked = true; });
  const ok = Z.qs.filter(q => q.sel === q.a).length, pct = Math.round(ok / n * 100), wrong = Z.qs.filter(q => q.sel !== q.a);
  S.quizzes.push({ title: Z.opt.title, pct, date: today(), n });
  if (Z.opt.id) S.scores[Z.opt.id] = pct;

  if (Z.opt.review) { const right = Z.qs.filter(q => q.sel === q.a).map(q => q.q); S.mistakes = S.mistakes.filter(m => !right.includes(m.q)); }

/* ---- flashcards ---- */
let FC = null;
function flash(topic) {
  const now = Date.now(); let pool = ALLW.filter(w => !topic || w.topic === topic);
  const dueW = pool.filter(w => S.srs[w.w] && S.srs[w.w].due <= now), newW = pool.filter(w => !S.srs[w.w]).slice(0, 10);
  const queue = shuffle(dueW.concat(newW)).slice(0, 25);
  FC = { queue, i: 0, flipped: false, topic, total: queue.length };
  flashView();
}
function flashView() {
  if (!FC || !FC.queue.length) return view(`${back('#/practice')}<div class="card" style="text-align:center"><h2>🎉 ${L('Hozircha takrorlash kerak bo\'lgan so\'z yo\'q', 'Nothing due right now')}</h2><p class="muted">${L('Keyinroq qaytib keling — yoki boshqa mavzuni tanlang.', 'Come back later or pick another topic.')}</p><button class="btn" data-go="#/lessons/vocab">Vocabulary</button></div>`);
  if (FC.i >= FC.queue.length) { addXP(Math.min(30, FC.total * 2), 'vocab'); return view(`<div class="hero" style="text-align:center"><h1>🎉 ${L('Seans tugadi', 'Session complete')}</h1><p>${FC.total} ${L('ta kartochka', 'cards')}</p></div><button class="btn" data-go="#/practice">OK</button>`); }
  const w = FC.queue[FC.i], r = S.srs[w.w];
  view(`<div class="row between">${back('#/practice')}<span class="muted">${FC.i + 1}/${FC.queue.length}</span></div>${bar(FC.i / FC.queue.length * 100)}
  <div class="flash"><div class="flash-inner" data-act="flip">${FC.flipped ? `<div class="big">${esc(w.uz)}</div><p>${esc(w.en)}</p><p style="opacity:.85">${esc(w.eu)}</p><span class="chip">${esc(w.pos)}</span>` : `<div class="big">${esc(w.w)}</div><p style="opacity:.85">${L('Tarjimani ko\'rish uchun bosing', 'Tap to flip')}</p>`}</div></div>
  <div class="row between">${sayBtn(w.w, '🔊 Play Audio')}<button class="btn sm sec" data-act="favWord" data-w="${esc(w.w)}">${S.favWords.includes(w.w) ? '★' : '☆'} Favorite</button></div>
  ${FC.flipped ? `<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:12px"><button class="btn bad sm" data-act="grade" data-g="again">Again</button><button class="btn warn sm" data-act="grade" data-g="hard">Hard</button><button class="btn sm" data-act="grade" data-g="good">Good</button><button class="btn ok sm" data-act="grade" data-g="easy">Easy</button></div>` : `<p class="muted" style="text-align:center;margin-top:12px">${r ? L('Oraliq', 'Interval') + ': ' + r.iv + ' ' + L('kun', 'd') : L('Yangi so\'z', 'New card')}</p>`}`);
}
function gradeCard(g) {
  const w = FC.queue[FC.i]; const r = S.srs[w.w] || { n: 0, iv: 0, due: 0 };
  if (g === 'again') { r.iv = 0; r.n = 0; r.due = Date.now() + 6e4; FC.queue.push(w); }
  else { r.n++; const b = r.iv || 1; r.iv = g === 'hard' ? Math.max(1, Math.round(b * 1.2)) : g === 'good' ? Math.max(1, Math.round(b * 2.2)) : Math.max(2, Math.round(b * 3.5)); r.due = Date.now() + r.iv * 864e5; }
  S.srs[w.w] = r; save(); FC.i++; FC.flipped = false; flashView();
}

  <div class="chat" id="chat">${m.map((x, i) => x.role === 'assistant' ? `<div><div class="msg ai">${esc(x.text)}</div><div class="row" style="margin:4px 0">${sayBtn(x.text, '🔊 Play Audio')}<button class="btn sm sec" data-act="aiTr" data-i="${i}">${x.uz ? 'Hide' : 'Show'} Translation</button></div>${x.uz ? `<div class="fb">${esc(x.uz)}</div>` : ''}</div>` : `<div style="align-self:flex-end;max-width:92%"><div class="msg user">${esc(x.text)}</div>${x.fb ? `<div class="fb">${x.showFb ? aiFb(x.fb) : `<button class="btn sm sec" data-act="aiFb" data-i="${i}">${L('Xatolarni ko\'rish', 'View feedback')}</button>`}</div>` : ''}</div>`).join('')}${AI.busy ? '<div class="msg ai">…</div>' : ''}</div>
  ${AI.err ? `<div class="notice">${AI.err}</div>` : ''}
  <div class="card"><textarea id="aiIn" placeholder="Type your answer in English…" ${AI.paused ? 'disabled' : ''}></textarea><div class="row" style="margin-top:8px"><button class="btn" id="aiMic" data-act="micFill" data-target="aiIn" ${AI.paused ? 'disabled' : ''}>🎤</button><button class="btn" data-act="aiSend" ${AI.paused || AI.busy ? 'disabled' : ''}>Send</button><button class="btn sec" data-act="aiUz">${L('O\'zbekcha izoh so\'rash', 'Ask in Uzbek')}</button></div></div>`);
  const c = $('#chat'); if (c) c.scrollTop = c.scrollHeight;
  clearTimers(); timers.push(setInterval(() => { const e = $('#aiTime'); if (!e || !AI) return; const s = Math.floor((Date.now() - AI.t0) / 1000); e.textContent = pad(Math.floor(s / 60)) + ':' + pad(s % 60); }, 1000));
}
function aiFb(f) { return `<b>Corrected answer:</b> ${esc(f.corrected || '—')}<br><b>Uzbek explanation:</b> ${esc(f.explanation_uz || '—')}<br><b>Better expression:</b> ${esc(f.better || '—')}<br><b>New vocabulary:</b> ${esc((f.vocab || []).join(', ') || '—')}<br><b>Follow-up question:</b> ${esc(f.followup || '—')}`; }
async function aiCall(action) {
  AI.busy = true; AI.err = ''; aiView();
  try {
    const r = await fetch(S.aiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action || 'chat', mode: AI.mode, level: AI.level, correction: AI.fix, messages: AI.msgs.map(m => ({ role: m.role, content: m.text })) }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
    const rep = AI.msgs.filter(m => m.role === 'user').slice(-1)[0];
    if (d.feedback && rep) { rep.fb = d.feedback; if (d.feedback.corrected && d.feedback.corrected.trim() && d.feedback.corrected.trim() !== rep.text.trim()) AI.fixes++; (d.feedback.vocab || []).forEach(v => { if (!AI.vocab.includes(v)) AI.vocab.push(v); }); (d.feedback.good_phrases || []).forEach(v => AI.good.push(v)); if (AI.fix === 'each') rep.showFb = true; }
    AI.msgs.push({ role: 'assistant', text: d.reply || '…' });
  } catch (e) {
    AI.err = '⚠️ ' + L('AI serveriga ulanib bo\'lmadi', 'Could not reach the AI backend') + ' (' + esc(S.aiUrl) + '): ' + esc(e.message) + '. ' + L('README dagi "AI backend" bo\'limiga qarang: funksiyani joylang va Profile → AI backend URL ga manzilni kiriting. Hozircha AI javob bera olmaydi.', 'See "AI backend" in the README: deploy the function and set its URL in Profile → AI backend URL. Until then the AI cannot reply.');
  }
  AI.busy = false; aiView();
}
function aiEnd() {
  if (!AI) return; clearTimers(); const A = AI, min = Math.max(1, Math.round((Date.now() - A.t0) / 60000));
  const asked = A.msgs.filter(m => m.role === 'assistant').length, ans = A.msgs.filter(m => m.role === 'user').length;
  if (ans) { S.speakSessions.push({ date: today(), mode: A.mode, min, answers: ans, fixes: A.fixes, vocab: A.vocab }); addXP(Math.min(40, ans * 5), 'speaking'); }
  view(`<div class="hero" style="text-align:center"><h1>🎤 ${L('Suhbat natijalari', 'Session results')}</h1><p>${esc(A.mode)} · ${esc(A.level)}</p></div>
  <div class="grid"><div class="card stat"><b>${min}</b>${L('daqiqa', 'min')}</div><div class="card stat"><b>${asked}</b>${L('Savollar', 'Questions')}</div><div class="card stat"><b>${ans}</b>${L('Javoblar', 'Answers')}</div><div class="card stat"><b>${A.fixes}</b>${L('Tuzatilgan xatolar', 'Corrections')}</div></div>
  <div class="card"><b>${L('O\'rganilgan yangi so\'zlar', 'New vocabulary')}</b><p>${A.vocab.length ? A.vocab.map(esc).join(', ') : '—'}</p><b>${L('Yaxshi iboralar', 'Good phrases')}</b><p>${A.good.length ? A.good.map(esc).join(', ') : '—'}</p></div>
  <p class="muted">${ans ? L('Natijalar Progress sahifasiga qo\'shildi.', 'Saved to Progress.') : L('Hech qanday javob berilmadi — natija saqlanmadi.', 'No answers given — nothing saved.')}</p>
  <div class="row"><button class="btn" data-go="#/ai" data-act="aiReset">${L('Yangi suhbat', 'New session')}</button><button class="btn sec" data-go="#/progress">Progress</button></div>`);
  AI = null;
}

/* ============ misc views ============ */
function notFound() { view(`<div class="card"><h2>${L('Sahifa topilmadi', 'Not found')}</h2>${goBtn('#/home', 'Home')}</div>`); }
function setNav(r) { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.route === r)); }

/* ============ router ============ */
function route() {
  clearTimers();
  const p = (location.hash || '#/home').replace(/^#\//, '').split('/'), r = p[0] || 'home', a = p[1], b = p[2];
  const main = { home: 'home', lessons: 'lessons', lesson: 'lessons', vocab: 'lessons', read: 'lessons', listen: 'lessons', speak: 'lessons', dlg: 'lessons', write: 'lessons', practice: 'practice', quiz: 'practice', flash: 'practice', daily: 'practice', typing: 'practice', builder: 'practice', ai: 'practice', search: 'practice', progress: 'progress', profile: 'profile' }[r] || 'home';
  setNav(main);
  ({ home, lessons: () => lessons(a, b), lesson: () => lesson(a), vocab: () => vocabTopic(a), read: () => reading(a), listen: () => listening(a), speak: () => speakTopic(a), dlg: () => dialogue(a), write: () => writing(a), practice, quiz: quizView, flash: () => flash(a), daily, typing, builder, search, progress, profile, ai: () => AI ? aiView() : aiHome() }[r] || notFound)();
}

/* ============ actions ============ */
const ACT = {
  say: el => say(el.dataset.t), sayslow: el => say(el.dataset.t, .6),
  reveal: el => { const b = $('#' + el.dataset.t); b.style.display = b.style.display === 'none' ? 'block' : 'none'; },
  toggleTr: () => { S.showTr = !S.showTr; save(); route(); },
  theme: () => { S.theme = S.theme === 'dark' ? 'light' : 'dark'; applyTheme(); save(); if (location.hash === '#/profile') route(); },
  saveName: () => { const n = $('#nameIn').value.trim(); if (!n) return toast(L('Ismingizni kiriting', 'Enter your name')); S.name = n; S.level = $('#lvlIn').value; touch(); save(); route(); },
  favLesson: el => { const id = el.dataset.id, i = S.favLessons.indexOf(id); i < 0 ? S.favLessons.push(id) : S.favLessons.splice(i, 1); save(); lesson(id); },
  favWord: el => { const w = el.dataset.w, i = S.favWords.indexOf(w); i < 0 ? S.favWords.push(w) : S.favWords.splice(i, 1); save(); if (FC && location.hash.startsWith('#/flash')) flashView(); else route(); },
  exCheck: el => { const g = GRAMMAR.find(x => x.id === el.dataset.id), i = +el.dataset.i, x = g.exercises[i], v = $('#ex' + i).value, ok = norm(v) === norm(x.a), out = $('#exr' + i); out.innerHTML = `<div class="explain">${ok ? '✅ ' + L('To\'g\'ri!', 'Correct!') : '❌ ' + L('Noto\'g\'ri.', 'Not quite.')}</div>`; if (ok) addXP(2, 'grammar'); },
  exShow: el => { const g = GRAMMAR.find(x => x.id === el.dataset.id), i = +el.dataset.i, x = g.exercises[i]; $('#exr' + i).innerHTML = `<div class="explain">✅ <b>${esc(x.a)}</b><br>${esc(x.e)}</div>`; },
  lessonQuiz: el => { const g = GRAMMAR.find(x => x.id === el.dataset.id); startQuiz(g.quiz, { title: g.title + ' — Quiz', id: 'g:' + g.id, count: 10, skill: 'grammar', retry: () => ACT.lessonQuiz(el), next: () => { location.hash = '#/lesson/' + g.id; } }); },
  doneLesson: el => { const id = el.dataset.id; if (!S.done[id]) { S.done[id] = today(); addXP(20, 'grammar'); toast('✅ +20 XP'); } else toast(L('Allaqachon bajarilgan', 'Already completed')); save(); lesson(id); },
  repeat: el => { lesson(el.dataset.id); },
  textQuiz: el => { const k = el.dataset.k, id = el.dataset.id, o = (k === 'reading' ? READING : LISTENING).find(x => x.id === id); startQuiz(o.questions, { title: o.title, id: k[0] + ':' + id, skill: k, count: 20, onFinish: pct => { if (pct >= 50) S.done[id] = today(); }, next: () => { location.hash = '#/lessons/' + k; } }); },
  vocabQuiz: el => { const t = VOCAB.find(x => x.id === el.dataset.id); startQuiz(vocabQs(t.words, Math.min(12, t.words.length)), { title: t.title + ' — Quiz', skill: 'vocab', count: 12, next: () => { location.hash = '#/lessons/vocab'; } }); },
  irrQuiz: () => { const qs = pick(IRREGULAR, 12).map(v => { const o = shuffle([v.v2].concat(pick(IRREGULAR.filter(x => x.v2 !== v.v2), 3).map(x => x.v2))); return { q: 'V2 of "' + v.v1 + '" (' + v.uz + ')?', o, a: o.indexOf(v.v2), e: v.v1 + ' — ' + v.v2 + ' — ' + v.v3 }; }); startQuiz(qs, { title: 'Irregular verbs', skill: 'grammar', count: 12 }); },
  mixedQuiz: () => startQuiz(pick(allGrammarQs(), 10).concat(vocabQs(ALLW, 6)), { title: 'Mixed quiz', count: 16, skill: 'grammar' }),
  grammarQuizAll: () => startQuiz(allGrammarQs(), { title: 'Grammar quiz', count: 15, skill: 'grammar' }),
  vocabQuizAll: () => startQuiz(vocabQs(ALLW, 15), { title: 'Vocabulary quiz', count: 15, skill: 'vocab' }),
  timed: () => startQuiz(pick(allGrammarQs(), 10).concat(vocabQs(ALLW, 5)), { title: 'Timed test', count: 15, timed: 300, skill: 'grammar' }),
  dailyQuiz: () => { const g = GRAMMAR[dayNum() % GRAMMAR.length]; startQuiz(g.quiz, { title: L('Kunlik test: ', 'Daily quiz: ') + g.title, count: 5, skill: 'grammar' }); },
  chQuiz: el => { const g = GRAMMAR.find(x => x.id === el.dataset.id); startQuiz(g.quiz, { title: 'Daily: ' + g.title, count: 5, skill: 'grammar', onFinish: () => { const c = S.ch[today()] = S.ch[today()] || {}; if (!c.quiz) { c.quiz = 1; addXP(10); } }, next: () => { location.hash = '#/daily'; } }); },
  review: () => { if (!S.mistakes.length) return toast(L('Saqlangan xato yo\'q 🎉', 'No saved mistakes 🎉')); startQuiz(S.mistakes.map(m => ({ q: m.q, o: m.o, a: m.a, e: m.e })), { title: 'Review Mistakes', count: 15, review: true, skill: 'grammar' }); },
  pick: el => { const q = QZ.qs[QZ.i]; if (q.checked) return; q.sel = +el.dataset.i; quizView(); },
  qcheck: () => { const q = QZ.qs[QZ.i]; q.checked = true; q.show = false; quizView(); },
  qexp: () => { QZ.qs[QZ.i].show = !QZ.qs[QZ.i].show; quizView(); },
  qnext: () => { QZ.i++; quizView(); }, qprev: () => { QZ.i--; quizView(); },
  qfinish: () => { const un = QZ.qs.filter(q => q.sel == null).length; if (un && !confirm(L(un + ' ta savolga javob berilmagan. Tugatamizmi?', un + ' unanswered. Finish?'))) return; finishQuiz(); },
  qretry: () => { const o = QZ.opt; if (o.retry) o.retry(); else startQuiz(QZ.qs.map(q => ({ q: q.q, o: q.o, a: q.a, e: q.e })), o); },
  qnextTest: () => { const o = QZ && QZ.opt; if (o && o.next) o.next(); else location.hash = '#/practice'; },
  flip: () => { FC.flipped = !FC.flipped; flashView(); }, grade: el => gradeCard(el.dataset.g),
  chDone: el => { const c = S.ch[today()] = S.ch[today()] || {}; if (!c[el.dataset.k]) { c[el.dataset.k] = 1; addXP(10); } daily(); },
  ch30: el => { const i = +el.dataset.i, k = S.ch30.indexOf(i); if (k < 0) { S.ch30.push(i); addXP(10, 'speaking'); } else S.ch30.splice(k, 1); save(); route(); },
  tyCheck: () => { const v = $('#tyIn').value, ok = norm(v) === norm(TY.w.w); $('#tyOut').innerHTML = `<div class="explain">${ok ? '✅' : '❌'} <b>${esc(TY.w.w)}</b><br>${esc(TY.w.en)} — ${esc(TY.w.eu)}</div>`; if (ok) addXP(2, 'vocab'); },
  typing: () => typing(), builder: () => builder(),
  bdAdd: el => { BD.built.push(+el.dataset.i); builderView(); }, bdUn: el => { BD.built.splice(+el.dataset.i, 1); builderView(); },
  bdCheck: () => { const s = BD.built.map(i => BD.words[i]).join(' ') + BD.punct, ok = norm(s) === norm(BD.ans); $('#bdOut').innerHTML = `<div class="explain">${ok ? '✅ ' : '❌ '}<b>${esc(BD.ans)}</b></div>`; if (ok) addXP(3, 'grammar'); },
  accent: el => { S.accent = el.dataset.v; save(); route(); },
  micPron: () => { const o = $('#pronOut'); listen(t => o.innerHTML = '<b>' + esc(t) + '</b>'); },
  micFill: el => { const ta = $('#' + el.dataset.target); listen(t => { ta.value = t; }, () => { el.textContent = '🎤' + (el.id === 'micBtn' ? ' Record' : ''); }); el.textContent = '⏺'; },
  saveSpeak: el => { const t = $('#spIn').value.trim(); if (!t) return toast(L('Avval javob bering (gapiring yoki yozing).', 'Answer first (speak or type).')); addXP(10, 'speaking'); toast('✅ +10 XP'); },
  cue: el => { const i = el.dataset.i, out = $('#cue' + i); let t = 60, phase = 'prep'; clearTimers(); out.textContent = 'Prep: 60s'; timers.push(setInterval(() => { t--; if (t <= 0) { if (phase === 'prep') { phase = 'speak'; t = 120; toast('Speak now!'); } else { clearTimers(); out.textContent = L('Vaqt tugadi', 'Time is up'); return; } } out.textContent = (phase === 'prep' ? 'Prep: ' : 'Speak: ') + t + 's'; }, 1000)); },
  wCheck: el => { const w = WRITING.find(x => x.id === el.dataset.id), t = $('#wIn').value; if (!t.trim()) return toast(L('Avval matn yozing', 'Write something first')); $('#wOut').innerHTML = `<div class="card"><b>${L('Oddiy avtomatik tekshiruv', 'Basic automatic check')}</b><p class="muted">${L('Bu AI emas va grammatik xatolarni topa olmaydi: faqat uzunlik, tinish belgilari va bog\'lovchilarni tekshiradi. Rasmiy baho emas.', 'Not AI: it only checks length, punctuation and linkers — it cannot find grammar mistakes and is not an official score.')}</p>${writeCheck(t, w).map(m => `<p>${m}</p>`).join('')}</div>`; },
  wSave: el => { const t = $('#wIn').value; if (!t.trim()) return toast('—'); S.writings = S.writings.filter(x => x.id !== el.dataset.id); S.writings.push({ id: el.dataset.id, text: t, date: today() }); addXP(10, 'writing'); toast('✅ Saved +10 XP'); },
  wAI: async el => { const w = WRITING.find(x => x.id === el.dataset.id), t = $('#wIn').value.trim(); if (!t) return toast(L('Avval matn yozing', 'Write something first')); const o = $('#wOut'); o.innerHTML = '<div class="card">…</div>'; try { const r = await fetch(S.aiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'writing', level: w.level, prompt: w.prompt, text: t }) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); o.innerHTML = `<div class="card"><b>🤖 AI feedback</b><p style="white-space:pre-wrap">${esc(d.reply || '')}</p><p class="muted">${L('Bu rasmiy IELTS bahosi emas.', 'Not an official IELTS score.')}</p></div>`; } catch (e) { o.innerHTML = `<div class="notice">⚠️ ${L('AI serveriga ulanib bo\'lmadi', 'AI backend unavailable')}: ${esc(e.message)}. README → "AI backend".</div>`; } },
  playDlg: el => { const d = DIALOGUES.find(x => x.id === el.dataset.id); sayQueue(d.lines.map(l => l[1])); },
  avatar: el => { S.avatar = el.dataset.v; save(); profile(); }, topic: el => { const v = el.dataset.v, i = S.topics.indexOf(v); i < 0 ? S.topics.push(v) : S.topics.splice(i, 1); save(); profile(); },
  notif: async () => { if (!S.notif) { if (!('Notification' in window)) return toast(L('Brauzer bildirishnomani qo\'llamaydi', 'Notifications unsupported')); const p = await Notification.requestPermission(); if (p !== 'granted') return toast(L('Ruxsat berilmadi', 'Permission denied')); S.notif = true; } else S.notif = false; save(); profile(); },
  saveProfile: () => { S.name = $('#pName').value.trim() || S.name; S.level = $('#pLevel').value; S.goal = +$('#pGoal').value; S.reason = $('#pReason').value; S.lang = $('#pLang').value; S.accent = $('#pAcc').value; S.aiUrl = $('#pAI').value.trim() || '/api/chat'; save(); applyLang(); toast('✅ Saved'); },
  saveAll: () => { save(); toast('✅ Saved'); },
  resetProg: () => { if (!confirm(L('Barcha o\'quv natijalari o\'chiriladi (profil qoladi). Davom etamizmi?', 'Reset all learning progress (profile stays)?'))) return; const keep = { name: S.name, avatar: S.avatar, level: S.level, goal: S.goal, reason: S.reason, topics: S.topics, theme: S.theme, lang: S.lang, notif: S.notif, accent: S.accent, aiUrl: S.aiUrl }; S = Object.assign(JSON.parse(JSON.stringify(DEF)), keep); save(); route(); },
  clearAll: () => { if (!confirm(L('Hamma ma\'lumot o\'chiriladi. Davom etamizmi?', 'Delete ALL data?'))) return; try { localStorage.removeItem('em_state'); } catch (e) {} load(); applyTheme(); applyLang(); location.hash = '#/home'; route(); },
  aiStart, aiEnd, aiReset: () => { AI = null; },
  aiPause: () => { AI.paused = !AI.paused; aiView(); },
  aiSend: () => { const ta = $('#aiIn'), t = ta.value.trim(); if (!t || AI.busy) return; AI.msgs.push({ role: 'user', text: t }); aiCall(); },
  aiUz: async () => { const last = AI.msgs.filter(m => m.role === 'assistant').slice(-1)[0]; if (!last) return toast('—'); ACT.aiTr({ dataset: { i: AI.msgs.indexOf(last) } }); },
  aiTr: async el => { const m = AI.msgs[+el.dataset.i]; if (m.uz) { m.uz = ''; return aiView(); } try { const r = await fetch(S.aiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'translate', text: m.text }) }); const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); m.uz = d.reply || ''; } catch (e) { AI.err = '⚠️ ' + esc(e.message); } aiView(); },
  aiFb: el => { AI.msgs[+el.dataset.i].showFb = true; aiView(); }
};
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); const g = e.target.closest('[data-go]');
  if (a && !a.disabled) { const f = ACT[a.dataset.act]; if (f) { f(a); } if (g && g === a) { location.hash = g.dataset.go; } return; }
  if (g) { location.hash = g.dataset.go; }
});
document.addEventListener('input', e => {
  if (e.target.id === 'irrQ') $('#irrBody').innerHTML = irrRows(e.target.value);
  if (e.target.id === 'sq') runSearch(e.target.value);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'aiIn') { e.preventDefault(); ACT.aiSend(); } });
$('#nav').addEventListener('click', e => { const b = e.target.closest('button'); if (b) location.hash = '#/' + b.dataset.route; });
$('#btnSearch').addEventListener('click', () => location.hash = '#/search');
$('#btnTheme').addEventListener('click', ACT.theme);
window.addEventListener('hashchange', route);

function applyTheme() { document.documentElement.dataset.theme = S.theme; $('#btnTheme').textContent = S.theme === 'dark' ? '☀️' : '🌙'; $('meta[name=theme-color]').content = S.theme === 'dark' ? '#0f1020' : '#4f46e5'; }
function applyLang() { document.documentElement.lang = S.lang; }
applyTheme(); applyLang();

/* study-time tracker: counts only while the tab is visible */
setInterval(() => { if (document.visibilityState === 'visible' && S.name) { rec().min += 0.5; save(); } }, 30000);

if (!location.hash) location.hash = '#/home'; else route();
})();
