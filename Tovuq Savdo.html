<title>Tovuq Savdo</title>

/* Layout: chap tomonda menyu, o‘ngda ish maydoni; telefonda menyu pastki panelga tushadi. Yolk-sariq faqat asosiy tugma va bugungi ustun uchun. */
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface2:#E4E9DF; --ink:#18221B; --muted:#5B695F; --line:#D3DACD;
  --accent:#F2B705; --accent-ink:#2A1F00; --brand:#1E5A3C; --brand-soft:#D7E8DD;
  --good:#1D7A45; --good-bg:#DCEFE3; --warn:#9A6208; --warn-bg:#F8EBCB; --bad:#B3362B; --bad-bg:#F6DAD6; --info:#2D5E8E; --info-bg:#DCE8F3;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1511; --surface:#171F19; --surface2:#202B22; --ink:#E8EEE6; --muted:#98A89B; --line:#2B382E;
  --accent:#F2B705; --accent-ink:#2A1F00; --brand:#6FCB9A; --brand-soft:#1F3A2A;
  --good:#58CB8B; --good-bg:#183425; --warn:#E8B34D; --warn-bg:#3A2D12; --bad:#F27A6E; --bad-bg:#3E1D19; --info:#7FB2E5; --info-bg:#182A3D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1511; --surface:#171F19; --surface2:#202B22; --ink:#E8EEE6; --muted:#98A89B; --line:#2B382E;
  --accent:#F2B705; --accent-ink:#2A1F00; --brand:#6FCB9A; --brand-soft:#1F3A2A;
  --good:#58CB8B; --good-bg:#183425; --warn:#E8B34D; --warn-bg:#3A2D12; --bad:#F27A6E; --bad-bg:#3E1D19; --info:#7FB2E5; --info-bg:#182A3D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 96px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.1rem);font-weight:700}
h2{font-size:1.1rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:32px;max-width:1240px;margin:0 auto}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:1.25rem}
.brand svg{flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:500}
.nav a svg{flex:none}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--line)}
.nav a[aria-current="page"] svg{color:var(--brand)}
.nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;display:grid;place-items:center;padding:0 6px}
.m-brand{display:none}
main{min-width:0;display:flex;flex-direction:column;gap:20px}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.top p{color:var(--muted);margin-top:4px}
.me{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 5px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--brand);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.me small{display:block;color:var(--muted);line-height:1.1}
.me b{display:block;line-height:1.2;font-weight:600}
.me .bell{position:relative;margin-left:4px;color:var(--muted)}
.me .bell i{position:absolute;top:-6px;right:-8px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-style:normal;font-size:.68rem;font-weight:700;display:grid;place-items:center;padding:0 4px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card>header span{color:var(--muted);font-size:.85rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.grid2.even{grid-template-columns:repeat(2,minmax(0,1fr))}

.kpis{display:grid;grid-template-columns:1.6fr repeat(3,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.kpi small{display:block;color:var(--muted);font-weight:500}
.kpi b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.7rem;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.main{background:var(--brand);border-color:var(--brand);color:var(--surface)}
.kpi.main small{color:inherit;opacity:.85}
.kpi.main b{font-size:2.3rem}
.kpi.main i{display:block;margin-top:6px;font-style:normal;font-size:.85rem;opacity:.85}

.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip em{font-style:normal;opacity:.7;margin-left:4px;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;line-height:1.2}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.95)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.sure{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:.85rem;border-radius:8px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.82rem;font-weight:600;color:var(--muted)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-width:0;width:100%}
input:focus,select:focus{border-color:var(--brand)}
.tinput{width:110px;text-align:right;font-variant-numeric:tabular-nums;padding:5px 8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.hint{color:var(--muted);font-size:.85rem}

.scroll{overflow-x:auto;margin-inline:-4px;padding-inline:4px}
table.tbl{border-collapse:collapse;width:100%;min-width:560px}
.tbl th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl td.r,.tbl th.r{font-variant-numeric:tabular-nums}
.tbl .name{font-weight:600}
.tbl .sub{display:block;color:var(--muted);font-size:.82rem;font-weight:400}
.sel{width:auto;padding:5px 8px;font-weight:600}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--info-bg);color:var(--info)}

.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-body);font-size:11px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .col{fill:var(--brand)}
.chart .col.today{fill:var(--accent)}
.chart .val{fill:var(--ink);font-weight:600}
.legend{display:flex;gap:16px;margin-top:8px;color:var(--muted);font-size:.82rem;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.stock{display:flex;flex-direction:column;gap:14px}
.stock .line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center}
.stock .nm{font-weight:600}
.stock .qty{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.meter{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand);border-radius:4px}

.list{display:flex;flex-direction:column}
.list>div{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list>div:last-child{border-bottom:0}
.list .l{min-width:0}
.list .l b{font-weight:600}
.list .l small{display:block;color:var(--muted)}
.empty{color:var(--muted);padding:12px 0}

.periods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.rank{display:flex;flex-direction:column;gap:12px}
.rank .rw{display:grid;grid-template-columns:1fr auto;gap:5px 10px}
.rank .rw span:first-child{font-weight:600;min-width:0}
.rank .rw span:nth-child(2){font-variant-numeric:tabular-nums}

.phone{font-variant-numeric:tabular-nums;user-select:all}
.pw{position:relative;display:flex}
.pw input{padding-right:44px}
.eye{position:absolute;right:3px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:var(--muted);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--ink);background:var(--surface2)}
.eye[aria-pressed="true"]{color:var(--brand)}
.gate{min-height:70vh;display:grid;place-items:center}
.gate-card{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px;padding:26px}
.err{color:var(--bad);background:var(--bad-bg);border-radius:9px;padding:8px 12px;font-weight:500;font-size:.9rem}
.notice{background:var(--info-bg);color:var(--info);border-radius:10px;padding:10px 14px;font-size:.88rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi.main{grid-column:1/-1}
  .grid2,.grid2.even{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  body{padding-block:16px 96px}
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  .side{position:static;gap:0}
  .side .brand{display:none}
  .m-brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.1rem}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:20;flex-direction:row;justify-content:space-between;gap:0;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav a{flex:1;min-width:0;flex-direction:column;gap:2px;padding:6px 0;font-size:.62rem;text-align:center;position:relative;border-radius:8px}
  .nav a[aria-current="page"]{box-shadow:none;background:var(--brand-soft);color:var(--brand)}
  .nav .dot{position:absolute;top:2px;right:calc(50% - 22px);margin:0;min-width:16px;height:16px;font-size:.62rem}
  .kpi.main b{font-size:2rem}
  .kpi b{font-size:1.3rem}
  .card{padding:14px}
}
@media (prefers-reduced-motion:no-preference){.card,.kpi{animation:rise .25s ease-out both}}
@keyframes rise{from{opacity:.0;transform:translateY(4px)}to{opacity:1;transform:none}}
</style>

  var AKEY = 'tovuq-savdo-auth', SKEY = 'tovuq-savdo-session', AUTH = null, sess = false;

  function hashPw(login, pw, salt) {
    var data = salt + '|' + login.toLowerCase() + '|' + pw;

        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(data)).then(function (b) {

      }
    } catch (e) { }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act'), id = b.getAttribute('data-id'), v = b.getAttribute('data-v');
    if (act === 'eye') {
      var inp = document.getElementById(b.getAttribute('data-for')), show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      b.setAttribute('aria-pressed', String(show));
      b.setAttribute('aria-label', show ? 'Parolni yashirish' : 'Parolni ko‘rsatish');
      inp.focus();
      return;
    }
    if (act === 'pcat') ui.pcat = v;
    else if (act === 'ofilter') { ui.ofilter = v; ui.olim = 30; }
    else if (act === 'omore') ui.olim += 30;
    else if (act === 'cmore') ui.clim += 25;
    else if (act === 'pform') ui.pform = !ui.pform;
    else if (act === 'oform') ui.oform = !ui.oform;
    else if (act === 'forgot') ui.forgot = true;
    else if (act === 'forgot-no') ui.forgot = false;
    else if (act === 'forgot-yes') {
      ui.forgot = false; AUTH = null; setSess(false); S = seed(); save();
      try { localStorage.removeItem(AKEY); } catch (e) { }
      toast('Yangi login va parol o‘rnating');
    }
    else if (act === 'logout') { setSess(false); gateEl.removeAttribute('data-mode'); location.hash = '#bosh'; }
    else if (act === 'dform') ui.dform = !ui.dform;
    else if (act === 'dfilter') ui.dfilter = v;
    else if (act === 'pay' || act === 'payall') {
      var d = byId(S.orders, id);
      if (d && d.debt) {
        var left = rem(d), amt = act === 'payall' ? left : parseFloat((document.getElementById('pay-' + id) || {}).value);
        if (!(amt > 0)) toast('To‘lov summasini kiriting');
        else { amt = Math.min(amt, left); d.debt.paid += amt; save(); toast(money(amt) + ' qabul qilindi' + (rem(d) <= 0 ? ', qarz yopildi' : '')); }
      }
    }
    else if (act === 'delp') {
      if (ui.confirm === id) { S.products = S.products.filter(function (p) { return p.id !== id; }); ui.confirm = null; save(); toast('Mahsulot o‘chirildi'); }
      else ui.confirm = id;
    } else if (act === 'advance') { var o = byId(S.orders, id); if (o) { o.status = v; save(); toast('B-' + o.id + ' holati: ' + v); } }
    else if (act === 'restock') { var p = byId(S.products, id); if (p) { p.qty = Math.round((p.qty + 50) * 10) / 10; save(); toast(p.name + ': +50 kg'); } }
    else if (act === 'seen') { S.seen = notifs().sig; save(); }
    else if (act === 'reset') {
      if (ui.confirm === 'reset') { S = seed(); ui.confirm = null; save(); toast('Namuna ma‘lumotlar tiklandi'); } else ui.confirm = 'reset';
    }
    render();
  });
  document.addEventListener('change', function (e) {
    var t = e.target, k = t.getAttribute('data-chg'); if (!k) return;
    var id = t.getAttribute('data-id');
    if (k === 'status') { var o = byId(S.orders, id); if (o) { o.status = t.value; save(); toast('B-' + o.id + ' holati: ' + o.status); render(); } }
    else { var p = byId(S.products, id), val = parseFloat(t.value); if (p && val >= 0) { p[k] = val; save(); toast(k === 'price' ? 'Narx yangilandi' : k === 'cost' ? 'Tannarx yangilandi' : 'Miqdor yangilandi'); render(); } }
  });
  document.addEventListener('input', function (e) {
    var k = e.target.getAttribute('data-inp'); if (!k) return;
    if (k === 'pq') { ui.pq = e.target.value; render(); }
    else if (k === 'oq') { ui.oq = e.target.value; ui.olim = 30; render(); }
    else if (k === 'cq') { ui.cq = e.target.value; ui.clim = 25; render(); }
    else if (k === 'dq') { ui.dq = e.target.value; render(); }
    else if (k === 'oform' || k === 'dform') updTotal();
  });
  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target.id, g = function (i) { return document.getElementById(i).value.trim(); };
    if (f === 'gform') { submitGate(); return; }
    if (f === 'afrm') { changeAuth(); return; }
    if (f === 'pform') {
      S.products.unshift({ id: 'p' + (S.nextP++), name: g('pf-name'), cat: parseInt(g('pf-cat'), 10), price: parseFloat(g('pf-price')), cost: parseFloat(g('pf-cost')), qty: parseFloat(g('pf-qty')) });
      ui.pform = false; save(); toast('Mahsulot qo‘shildi'); render();
    } else if (f === 'oform') {
      var p = byId(S.products, document.getElementById('of-prod').value), q = parseFloat(g('of-qty')), nm = g('of-name'), c;
      S.customers.forEach(function (x) { if (x.name.toLowerCase() === nm.toLowerCase()) c = x; });
      if (!c) { c = { id: 'c' + (S.nextC++), name: nm, phone: g('of-phone') || '—' }; S.customers.push(c); }
      S.orders.push({ id: S.nextO++, date: new Date().toISOString(), cid: c.id, product: p.name, cat: CATS[p.cat], qty: q, amount: Math.round(p.price * q), cost: Math.round(p.cost * q), status: 'Yangi' });
      p.qty = Math.max(0, Math.round((p.qty - q) * 10) / 10);
      ui.oform = false; ui.ofilter = 'all'; save(); toast('Buyurtma yaratildi'); render();
    } else if (f === 'dform') {
      var dp = byId(S.products, document.getElementById('df-prod').value), dq = parseFloat(g('df-qty')), dn = g('df-name'), dc;
      S.customers.forEach(function (x) { if (x.name.toLowerCase() === dn.toLowerCase()) dc = x; });
      if (!dc) { dc = { id: 'c' + (S.nextC++), name: dn, phone: g('df-phone') || '—' }; S.customers.push(dc); }
      var tot = Math.round(dp.price * dq), first = Math.min(Math.max(parseFloat(g('df-paid')) || 0, 0), tot);
      S.orders.push({ id: S.nextO++, date: new Date().toISOString(), cid: dc.id, product: dp.name, cat: CATS[dp.cat], qty: dq, amount: tot, cost: Math.round(dp.cost * dq), status: 'Yangi', debt: { paid: first, due: g('df-due') } });
      dp.qty = Math.max(0, Math.round((dp.qty - dq) * 10) / 10);
      ui.dform = false; ui.dfilter = 'open'; save(); toast('Qarz yozildi: ' + money(tot - first)); render();
    } else if (f === 'pfrm') {
      S.profile = { name: g('ap-name'), role: g('ap-role'), phone: g('ap-phone'), shop: g('ap-shop') };
      save(); toast('Profil saqlandi'); render();
    }
  });
  window.addEventListener('hashchange', route);
  window.matchMedia('(max-width:860px)').addEventListener('change', render);
  route();
})();
</script>

</body></html>
